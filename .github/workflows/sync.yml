name: Sync Master with Dev

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: '${{ secrets.USUARIO_A_CARGO_TOKEN }}'
      - name: sync branch temp-web from web
        run: |
          set x
          git config --global user.name "jculajayuniversales"
          git config --global user.email "jculajay@universales.com"
          git status
          git pull
          git checkout -b temp-web
          git merge web
          git push --set-upstream origin temp-web